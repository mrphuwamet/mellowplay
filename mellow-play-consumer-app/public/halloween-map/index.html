<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween ซอยบ้าน 55 · มุมมอง 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(255,250,242,.92); --ink:#2a1d14; --muted:#6d5a4a; --accent:#e8701a; --line:rgba(42,29,20,.14);
  --chip:#fff; --chip-on:#2a1d14; --chip-on-ink:#ffd9a8; --label-bg:rgba(255,255,255,.9); --label-ink:#2a1d14;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --panel:rgba(26,18,30,.88); --ink:#f6e9da; --muted:#bfa9c4; --accent:#ff9a3c; --line:rgba(255,255,255,.14);
  --chip:rgba(255,255,255,.08); --chip-on:#ff9a3c; --chip-on-ink:#1d1220; --label-bg:rgba(24,16,28,.86); --label-ink:#ffe7cc; color-scheme:dark;}}
:root[data-theme="dark"]{--panel:rgba(26,18,30,.88); --ink:#f6e9da; --muted:#bfa9c4; --accent:#ff9a3c; --line:rgba(255,255,255,.14);
  --chip:rgba(255,255,255,.08); --chip-on:#ff9a3c; --chip-on-ink:#1d1220; --label-bg:rgba(24,16,28,.86); --label-ink:#ffe7cc; color-scheme:dark;}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#140d1a;font-family:"Sarabun",Tahoma,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0}
canvas{display:block;touch-action:none}
.head{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;max-width:calc(100% - 20px);background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:7px 12px;border:1px solid var(--line);z-index:5}
.head h1{font-family:"Mitr","Sarabun",sans-serif;font-weight:600;font-size:clamp(17px,4.6vw,22px);line-height:1.25}
.head p{font-size:13.5px;color:var(--muted);margin-top:2px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:8px;z-index:5;justify-content:center}
.group{display:flex;gap:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:5px;border-radius:14px;border:1px solid var(--line)}
button{font:600 14px "Sarabun",sans-serif;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{position:absolute;top:0;left:0;pointer-events:none;white-space:nowrap;font:600 11.5px/1.3 "Sarabun",sans-serif;
  background:var(--label-bg);color:var(--label-ink);padding:1px 7px;border-radius:7px;border:1px solid var(--line);z-index:3;visibility:hidden}
.lbl.big{font-family:"Mitr",sans-serif;font-weight:500;font-size:12.5px;border-color:var(--accent)}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;width:1px;height:5px;background:var(--accent)}
#labels.off .lbl{display:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div class="head">
  <h1>Halloween ในซอยบ้านเลขที่ 55</h1>
  <p class="hint" id="hint">ลากเพื่อหมุน · ถ่างสองนิ้วเพื่อซูม</p>
</div>
<div class="bar">
  <div class="group" role="group" aria-label="มุมมอง">
    <button data-view="over" aria-pressed="true">มุมสูง</button>
    <button data-view="mouth" aria-pressed="false">ปากซอย</button>
    <button data-view="garden" aria-pressed="false">ในสวน</button>
    <button data-view="yard" aria-pressed="false">หน้าบ้าน</button>
    <button data-view="top" aria-pressed="false">ผังบน</button>
  </div>
  <div class="group">
    <button id="night" aria-pressed="true">กลางคืน</button>
    <button id="lbl" aria-pressed="true">ตัวหนังสือ: เปิด</button>
    <button id="ppl" aria-pressed="true">ผู้คน: เปิด</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,400);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=4; controls.maxDistance=120;

// ---------- helpers ----------
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
const emissives=[]; // materials that glow at night
const E=(c,glow,i=1.6)=>{const m=M(c,{emissive:glow,emissiveIntensity:i});m.userData.glow=i;emissives.push(m);return m;};
function box(w,h,d,mat,x,y,z,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;}
function plane(w,d,mat,x,z,y=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;}
function hipRoof(w,d,h,inset,mat,x,y,z){
  const a=[-w/2,0,-d/2],b=[w/2,0,-d/2],c=[w/2,0,d/2],e=[-w/2,0,d/2];
  const r1=[-w/2+inset,h,0],r2=[w/2-inset,h,0];
  const tri=[e,c,r2, e,r2,r1, b,a,r1, b,r1,r2, a,e,r1, c,b,r2].flat();
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(tri,3));const uv=[];for(let i=0;i<tri.length;i+=3)uv.push((tri[i]+tri[i+2])*.7,tri[i+1]*1.1);g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);mat.side=THREE.DoubleSide;m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;}
function pyramid(w,d,h,mat,x,y,z){const g=new THREE.ConeGeometry(Math.SQRT1_2,1,4,1);g.rotateY(Math.PI/4);const m=new THREE.Mesh(g,mat);m.scale.set(w,h,d);m.position.set(x,y+h/2,z);m.castShadow=true;scene.add(m);return m;}
const labels=[];const labelBox=document.getElementById('labels');
function label(t,x,y,z,big){const d=document.createElement('div');d.className='lbl'+(big?' big':'');d.textContent=t;labelBox.appendChild(d);labels.push({d,v:new THREE.Vector3(x,y,z),big:!!big,w:0,h:0});}

// ---------- ground ----------
// procedural textures
const ANI=renderer.capabilities.getMaxAnisotropy();
function tex(size,draw,rx,ry){const cv=document.createElement('canvas');cv.width=cv.height=size;const g=cv.getContext('2d');draw(g,size);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANI;return t;}
function speckle(g,s,base,cols,n,sz){g.fillStyle=base;g.fillRect(0,0,s,s);for(let i=0;i<n;i++){g.globalAlpha=.2+Math.random()*.4;g.fillStyle=cols[i%cols.length];const r=Math.random()*sz+1;g.fillRect(Math.random()*s,Math.random()*s,r,r);}g.globalAlpha=1;}
const drawGrass=(g,s)=>{speckle(g,s,'#6a9647',['#7aa952','#577f3c','#86b65c','#4a7034'],4000,2.5);g.lineWidth=1;for(let i=0;i<700;i++){const x=Math.random()*s,y=Math.random()*s;g.strokeStyle=Math.random()<.5?'rgba(35,65,20,.35)':'rgba(150,200,100,.3)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*3,y-3-Math.random()*5);g.stroke();}};
const drawConc=(g,s)=>{speckle(g,s,'#bdb8ae',['#a9a49a','#cbc7bf','#9e998f','#d6d2ca'],5000,2);for(let i=0;i<6;i++){g.globalAlpha=.08;g.fillStyle='#6e6a62';g.beginPath();g.ellipse(Math.random()*s,Math.random()*s,20+Math.random()*50,10+Math.random()*30,Math.random()*3,0,7);g.fill();}g.globalAlpha=1;g.fillStyle='#6f6b63';g.fillRect(0,0,s,3);g.fillRect(0,0,3,s);};
const drawAsph=(g,s)=>speckle(g,s,'#8d8a85',['#77746f','#a3a09a','#6a6762','#b0ada7'],7000,1.8);
const drawPave=(g,s)=>{g.fillStyle='#9a8f7f';g.fillRect(0,0,s,s);const n=2,w=s/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=Math.floor(200+Math.random()*25);g.fillStyle=`rgb(${v+18},${v+6},${v-14})`;g.fillRect(i*w+3,j*w+3,w-6,w-6);g.globalAlpha=.15;for(let k=0;k<300;k++){g.fillStyle=Math.random()<.5?'#7d7364':'#fff';g.fillRect(i*w+Math.random()*w,j*w+Math.random()*w,2,2);}g.globalAlpha=1;}};
const drawPlaster=(g,s)=>speckle(g,s,'#efece5',['#e3dfd6','#f7f5f0','#dcd7cd'],3000,2);
const drawRoof=(g,s)=>{const rows=4,h=s/rows;for(let r=0;r<rows;r++){const gr=g.createLinearGradient(0,r*h,0,(r+1)*h);gr.addColorStop(0,'#7a6457');gr.addColorStop(.75,'#5b4a40');gr.addColorStop(1,'#3a2e28');g.fillStyle=gr;g.fillRect(0,r*h,s,h);g.fillStyle='rgba(0,0,0,.25)';for(let c=0;c<4;c++)g.fillRect(c*s/4+(r%2)*s/8,r*h,2,h);}speckle;};
const MT=(draw,rx,ry,o={})=>new THREE.MeshStandardMaterial(Object.assign({map:tex(256,draw,rx,ry),roughness:.95},o));
const grass=MT(drawGrass,8,6),verge=MT(drawGrass,8,.3,{color:0xe6ffd8}),conc=MT(drawConc,33/3,2),road=MT(drawAsph,2,26),yard=MT(drawPave,22/1.2,16/1.2),lawn2=MT(drawGrass,1.2,6);
plane(140,140,MT(drawGrass,40,40,{color:0xbfcfb0}),16,21,-0.02);
plane(26,19,grass,13,9.5,0.01);
plane(26,1,verge,13,19.5,0.015);
plane(33,6,conc,9.5,23,0.02);
// soi end gate
box(.5,1.8,.5,M(0xe6e3dc),-7,.9,20.3);box(.5,1.8,.5,M(0xe6e3dc),-7,.9,25.7);
for(let z=20.7;z<25.4;z+=.22)box(.05,1.4,.05,M(0x4a4a4a),-7,.7,z,false);
plane(6,80,road,29,21,0.02);
plane(22,16,yard,15,34,0.02);
plane(3,15,lawn2,5.5,34.5,0.03); plane(3,16,lawn2,24.5,34,0.03);
// curbs + road lines
const curb=M(0xe9e6df);
box(33,0.15,0.2,curb,9.5,0.07,20,false);box(33,0.15,0.2,curb,9.5,0.07,26,false);
for(let z=-18;z<60;z+=3) box(0.15,0.02,1.6,M(0xf2f2f2),29,0.03,z,false);


// ---------- trees ----------
const trunk=M(0x5b4331),leafA=M(0x3f6e34),leafB=M(0x557f3c);
function tree(x,z,s=1,stk=true){const t=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,3.2*s,8),trunk);t.position.set(x,1.6*s,z);t.castShadow=true;scene.add(t);
  [[0,4.4,0,1.9],[1,4,0.6,1.4],[-1,4.1,-0.5,1.5],[0.3,5.3,-0.3,1.3],[-0.6,4,0.9,1.2]].forEach(([dx,dy,dz,r],i)=>{
    const l=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1),i%2?leafA:leafB);l.position.set(x+dx*s,dy*s,z+dz*s);l.castShadow=true;scene.add(l);});
  // stakes
  if(stk)for(let k=0;k<3;k++){const st=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.6,5),M(0x8a6a48));const a=k*2.1;st.position.set(x+Math.cos(a)*.8,1.1,z+Math.sin(a)*.8);st.rotation.z=Math.cos(a)*.35;st.rotation.x=-Math.sin(a)*.35;scene.add(st);}
}
[[4.7,3],[10.1,3],[15.5,3],[5.9,15],[10.3,14.6],[15.2,15]].forEach(p=>tree(p[0],p[1],1.15));
[[-6,6],[-8,16],[36,8],[38,30],[-5,32],[20,52],[8,50]].forEach(p=>tree(p[0],p[1],1.3));
// extra trees + shrubs around the house
[[5.4,32.3,.7],[5.4,38.8,.75],[24.6,35.4,.75],[24.6,40.3,.7],[35,16,1.1],[34.5,26,.95],[35.5,41,1.2],[-9,17.5,1.1],[-3.5,42,1.2],[28.5,50,1.1],[3,49,1],[24.5,55,1.2],[-10,-4,1.3],[12,-8,1.4],[30,-6,1.2],[-12,30,1.3],[40,18,1.2]].forEach(([x,z,s])=>tree(x,z,s,false));
const shrubM=[M(0x4f7d3a),M(0x3f6a30),M(0x6b9a45)],shrubG=new THREE.IcosahedronGeometry(1,1);
function shrub(x,z,r){const m=new THREE.Mesh(shrubG,shrubM[Math.floor(Math.random()*3)]);m.scale.set(r,r*.75,r);m.position.set(x,r*.55,z);m.castShadow=true;scene.add(m);}
for(let z=31.4;z<41.6;z+=1.05)shrub(4.55,z,.45);
for(let z=32.4;z<41.6;z+=1.05)shrub(25.5,z,.45);
for(let x=7.8;x<23;x+=1.15){if(x>11.3&&x<15.6)continue;shrub(x,33.35,.36);}
label('สวนส่วนกลาง',10,7.5,1,true);

// ---------- music stage ----------
// small busking stage facing +x (toward workshop)
box(2.2,0.35,3.2,M(0x6b4a33),1.7,0.18,9);
box(0.15,2.6,3.6,M(0x241433),0.55,1.65,9);
box(0.12,0.12,3.4,E(0x9b5cff,0x9b5cff,2.2),0.65,2.95,9,false);
for(let i=0;i<9;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),E(0xffe7b0,0xffc266,2.4));b.position.set(0.72,2.6-Math.sin(i/8*Math.PI)*.35,7.4+i*.4);scene.add(b);}
const spk=M(0x161616);box(.5,.9,.5,spk,1.1,.8,7.75);box(.5,.9,.5,spk,1.1,.8,10.25);
const stool=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.55,12),M(0x2b2030));stool.position.set(1.6,.62,9.3);scene.add(stool);
const micS=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.4,6),M(0x222222));micS.position.set(2.2,1.05,9.3);scene.add(micS);
const mic=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),M(0x555555));mic.position.set(2.2,1.78,9.3);scene.add(mic);
// computer (laptop) on a little table
box(.7,.05,.5,M(0x3a3a3a),1.8,1.05,8.4);box(.05,.68,.05,M(0x222222),1.8,.7,8.4,false);
box(.34,.02,.24,M(0xbfc4c9),1.8,1.09,8.4,false);
const scr=box(.02,.24,.34,E(0x9fd3ff,0x7cc4ff,1.6),1.66,1.21,8.4,false);scr.rotation.z=-.25;
// open hat (busking)
const brim=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.02,20),M(0x3b2a20));brim.position.set(3.1,.03,9);scene.add(brim);
const crown=new THREE.Mesh(new THREE.CylinderGeometry(.16,.17,.14,20,1,true),M(0x3b2a20));crown.position.set(3.1,.1,9);scene.add(crown);
// hay bales: seats in an arc facing the stage + a stacked pile
const hay=M(0xd8b257,{roughness:1});
for(let i=0;i<5;i++){const a=(-50+i*25)*Math.PI/180;const hb=box(1.1,.5,.5,hay,1.7+3.4*Math.cos(a),.25,9+3.4*Math.sin(a));hb.rotation.y=-a+Math.PI/2;}
for(let i=0;i<5;i++){const a=(-40+i*20)*Math.PI/180;const hb=box(1.1,.5,.5,hay,1.7+4.5*Math.cos(a),.25,9+4.5*Math.sin(a));hb.rotation.y=-a+Math.PI/2;}
box(1.1,.5,.5,hay,1.2,.25,11.6);box(1.1,.5,.5,hay,1.2,.75,11.6);box(1.1,.5,.5,hay,1.2,.25,12.2);
box(1.1,.5,.5,hay,1.2,.25,6.4);box(1.1,.5,.5,hay,1.2,.75,6.4);
label('ดนตรีเปิดหมวก',1.7,3.4,9,true);

// ---------- workshop ----------
const wood=M(0xb98a5c);
[[7.9,6.3],[7.9,11.4],[17,6]].forEach(([x,z])=>{box(1.8,.08,.9,wood,x,.76,z);[[-.8,-.35],[.8,-.35],[-.8,.35],[.8,.35]].forEach(([a,b])=>box(.06,.74,.06,M(0x333333),x+a,.37,z+b,false));
  box(.5,.45,.4,M(0xe8e2d6),x,.22,z+.85);box(.5,.45,.4,M(0xe8e2d6),x,.22,z-.85);
  const p=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),E(0xff8a1f,0xff6a00,1.2));p.scale.y=.8;p.position.set(x+.5,.92,z);scene.add(p);});
// floor mats (เสื่อ)
function matTex(c1,c2){const cv=document.createElement('canvas');cv.width=64;cv.height=64;const g=cv.getContext('2d');for(let i=0;i<8;i++){g.fillStyle=i%2?c1:c2;g.fillRect(0,i*8,64,8);}g.fillStyle=c1;g.fillRect(0,0,4,64);g.fillRect(60,0,4,64);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;}
[[11,7.2,'#b33a2a','#f2d9a6'],[14,7.2,'#3c6e8f','#f2e6c9'],[12.5,10.7,'#6b8f3c','#f4e7c4']].forEach(([x,z,a,b])=>{
  const mt=plane(2.2,2.8,new THREE.MeshStandardMaterial({map:matTex(a,b),roughness:1}),x,z,0.045);
  [[-.7,-1],[.7,-1],[-.7,1],[.7,1]].forEach(([dx,dz])=>box(.4,.12,.4,M(0xece3d3),x+dx,.1,z+dz));
  box(.5,.03,.35,M(0xffffff),x,.06,z,false);box(.18,.12,.18,M(0xff8a1f),x+.35,.1,z+.2,false);box(.14,.1,.14,M(0x7b3fe4),x-.3,.09,z-.15,false);});
label('Workshop โต๊ะ + เสื่อ',12.5,1.4,8.8);

// ---------- game area + path ----------
const disc=new THREE.Mesh(new THREE.CircleGeometry(1,48),M(0x8fb86a));disc.rotation.x=-Math.PI/2;disc.scale.set(3.5,3.5,1);disc.position.set(21.7,.03,8.5);disc.receiveShadow=true;scene.add(disc);
plane(6.5,0.9,M(0xd9c2a0),22.05,17,0.025);plane(0.9,15.5,M(0xd9c2a0),25.3,9.25,0.025);
// clear inflatable bubble house with balloons inside
const domeMat=new THREE.MeshPhysicalMaterial({color:0xe6f6ff,transparent:true,opacity:.2,roughness:.04,metalness:0,clearcoat:1,clearcoatRoughness:.05,side:THREE.DoubleSide,depthWrite:false});
const dome=new THREE.Mesh(new THREE.SphereGeometry(3,48,24,0,Math.PI*2,0,Math.PI/2),domeMat);dome.position.set(21.7,0,8.5);dome.scale.y=1.05;dome.renderOrder=2;scene.add(dome);
const ring=new THREE.Mesh(new THREE.TorusGeometry(3,.2,10,48),M(0xffffff,{roughness:.4}));ring.rotation.x=Math.PI/2;ring.position.set(21.7,.2,8.5);scene.add(ring);
const tun=new THREE.Mesh(new THREE.CylinderGeometry(.95,.95,1.8,24,1,true),domeMat);tun.rotation.z=Math.PI/2;tun.position.set(18.5,0,8.5);tun.renderOrder=2;scene.add(tun);

function loop(pts){const seg=[];let L=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,l,L]);L+=l;}
