<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mellow Play" />
    <link rel="manifest" href="/site.webmanifest" />

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=Sarabun:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Mellow Play — คลาสเรียนและกิจกรรมพัฒนาการสำหรับเด็ก จองคลาสเรียน ติดตามพัฒนาการ และสะสมคูปองได้ในที่เดียว" />
    <!-- Site-wide fallback for social link previews (Facebook/LINE/Twitter/etc.) —
         crawlers don't run JS, so this static tag set is all they ever see
         unless a route has its own server-side version (see /class/:id and
         the legacy /course/:id, handled by functions/class/[id].ts and
         functions/course/[id].ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mellow Play" />
    <meta property="og:title" content="Mellow Play" />
    <meta property="og:description" content="คลาสเรียนและกิจกรรมพัฒนาการสำหรับเด็ก จองคลาสเรียน ติดตามพัฒนาการ และสะสมคูปองได้ในที่เดียว" />
    <meta property="og:image" content="https://mellowplay.co/web-app-manifest-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://mellowplay.co/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mellow Play" />
    <meta name="twitter:description" content="คลาสเรียนและกิจกรรมพัฒนาการสำหรับเด็ก จองคลาสเรียน ติดตามพัฒนาการ และสะสมคูปองได้ในที่เดียว" />
    <meta name="twitter:image" content="https://mellowplay.co/web-app-manifest-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot failure screen.

         ErrorBoundary (src/components/ErrorBoundary.tsx) catches errors thrown
         while React renders. It cannot catch a failure BEFORE React ever runs:
         a bundle the browser can't parse, a script that 404s, a module-scope
         throw. Those show a white page and nothing else, which is exactly what
         a Safari user reported and what no log we keep can explain.

         Deliberately plain ES5 in an inline classic script, so it runs even on
         a browser too old to parse the app bundle itself — the case it exists
         to report. It says nothing at all unless #root is still empty after
         eight seconds, so a slow connection is never mistaken for a failure. -->
    <script>
      (function () {
        var failure = null;
        var RETRY_KEY = 'mellow_boot_retry';
        window.addEventListener('error', function (e) {
          failure = (e && (e.message || (e.error && e.error.message))) || 'script error';
        });

        /* A file that fails to LOAD does not reach the handler above.
         *
         * A 404 on a <script> or <link> fires its error at the element, and an
         * element's error event does not bubble — a window listener only sees
         * it in the capture phase. Without this the app came up blank and
         * reported "no error reported", which reads as a mystery and sent
         * everyone looking at the wrong thing.
         *
         * It is not a rare case. Every deploy publishes a new index.html
         * pointing at new hashed filenames, so any tab still holding the
         * previous index.html asks for a bundle that is no longer there. The
         * fix is simply to fetch index.html again, which is what the reload
         * below does — once per tab, guarded by sessionStorage, because a
         * reload loop is a worse failure than the blank page it replaces. */
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (!el || el === window) return;
          var tag = (el.tagName || '').toUpperCase();
          if (tag !== 'SCRIPT' && tag !== 'LINK') return;
          var url = el.src || el.href || '';
          failure = 'ไม่สามารถโหลดไฟล์ของแอปได้: ' + url;
          if (url.indexOf('/assets/') === -1) return;
          try {
            if (sessionStorage.getItem(RETRY_KEY)) return;
            sessionStorage.setItem(RETRY_KEY, '1');
          } catch (err) {
            return; /* no storage to remember a retry by — never risk a loop */
          }
          location.reload();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          failure = (e && e.reason && (e.reason.message || String(e.reason))) || 'promise rejection';
        });
        var mounted = function () {
          var root = document.getElementById('root');
          return !!root && root.children.length > 0;
        };
        /* Once the app is up, forget the retry — the next stale-bundle deploy
         * gets its own attempt rather than inheriting a spent one. */
        var clearRetry = function () {
          try { sessionStorage.removeItem(RETRY_KEY); } catch (err) { /* nothing to clear */ }
        };
        var mountWatch = setInterval(function () {
          if (!mounted()) return;
          clearInterval(mountWatch);
          clearRetry();
        }, 500);
        setTimeout(function () {
          if (mounted()) return;
          var box = document.createElement('div');
          box.id = 'boot-failure';
          box.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:#fbfaf7;font-family:Sarabun,sans-serif;color:#334155');
          box.innerHTML =
            '<div style="font-size:17px;font-weight:800;margin-bottom:8px">เปิดแอปไม่สำเร็จ</div>' +
            '<div style="font-size:13px;font-weight:600;color:#64748b;max-width:280px;line-height:1.7">' +
            (failure && failure.indexOf('โหลดไฟล์ของแอป') !== -1
              ? 'โหลดไฟล์ของแอปไม่สำเร็จ — มักเกิดหลังอัปเดตระบบ กด "โหลดหน้าใหม่" อีกครั้งเพื่อดึงเวอร์ชันล่าสุด'
              : 'เบราว์เซอร์นี้อาจเป็นเวอร์ชันเก่าเกินไป ลองอัปเดต iOS/Safari หรือเปิดด้วย Chrome ดูอีกครั้ง') +
            '</div>' +
            '<div style="margin-top:20px;font-size:11px;font-weight:600;color:#94a3b8;word-break:break-word;max-width:300px">' +
            (failure ? String(failure).replace(/</g, '&lt;') : 'no error reported') +
            '<br>' + String(navigator.userAgent).replace(/</g, '&lt;') + '</div>' +
            /* A cache-busting query, so the button cannot be answered from the
             * same cache that produced the blank page. */
            '<a href="' + location.pathname + '?r=' + Date.now() + '" style="margin-top:24px;padding:12px 24px;background:#7c5cff;color:#fff;border-radius:16px;font-size:13px;font-weight:800;text-decoration:none">โหลดหน้าใหม่</a>';
          document.body.appendChild(box);
          // An overlay rather than replacing #root, and it steps aside if the
          // app does turn up — a phone on a bad connection is slow, not
          // broken, and must not be told otherwise.
          var poll = setInterval(function () {
            if (!mounted()) return;
            clearInterval(poll);
            if (box.parentNode) box.parentNode.removeChild(box);
          }, 500);
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
