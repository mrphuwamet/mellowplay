<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mellow Play" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=Sarabun:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Mellow Play — คลาสเรียนและกิจกรรมพัฒนาการสำหรับเด็ก จองคลาสเรียน ติดตามพัฒนาการ และสะสมคูปองได้ในที่เดียว" />
    <!-- Site-wide fallback for social link previews (Facebook/LINE/Twitter/etc.) —
         crawlers don't run JS, so this static tag set is all they ever see
         unless a route has its own server-side version (see /class/:id and
         the legacy /course/:id, handled by functions/class/[id].ts and
         functions/course/[id].ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mellow Play" />
    <meta property="og:title" content="Mellow Play" />
    <meta property="og:description" content="คลาสเรียนและกิจกรรมพัฒนาการสำหรับเด็ก จองคลาสเรียน ติดตามพัฒนาการ และสะสมคูปองได้ในที่เดียว" />
    <meta property="og:image" content="https://mellowplay.co/web-app-manifest-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://mellowplay.co/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mellow Play" />
    <meta name="twitter:description" content="คลาสเรียนและกิจกรรมพัฒนาการสำหรับเด็ก จองคลาสเรียน ติดตามพัฒนาการ และสะสมคูปองได้ในที่เดียว" />
    <meta name="twitter:image" content="https://mellowplay.co/web-app-manifest-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot failure screen.

         ErrorBoundary (src/components/ErrorBoundary.tsx) catches errors thrown
         while React renders. It cannot catch a failure BEFORE React ever runs:
         a bundle the browser can't parse, a script that 404s, a module-scope
         throw. Those show a white page and nothing else, which is exactly what
         a Safari user reported and what no log we keep can explain.

         Deliberately plain ES5 in an inline classic script, so it runs even on
         a browser too old to parse the app bundle itself — the case it exists
         to report. It says nothing at all unless #root is still empty after
         eight seconds, so a slow connection is never mistaken for a failure. -->
    <script>
      (function () {
        var failure = null;
        window.addEventListener('error', function (e) {
          failure = (e && (e.message || (e.error && e.error.message))) || 'script error';
        });
        window.addEventListener('unhandledrejection', function (e) {
          failure = (e && e.reason && (e.reason.message || String(e.reason))) || 'promise rejection';
        });
        var mounted = function () {
          var root = document.getElementById('root');
          return !!root && root.children.length > 0;
        };
        setTimeout(function () {
          if (mounted()) return;
          var box = document.createElement('div');
          box.id = 'boot-failure';
          box.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:#fbfaf7;font-family:Sarabun,sans-serif;color:#334155');
          box.innerHTML =
            '<div style="font-size:17px;font-weight:800;margin-bottom:8px">เปิดแอปไม่สำเร็จ</div>' +
            '<div style="font-size:13px;font-weight:600;color:#64748b;max-width:280px;line-height:1.7">เบราว์เซอร์นี้อาจเป็นเวอร์ชันเก่าเกินไป ลองอัปเดต iOS/Safari หรือเปิดด้วย Chrome ดูอีกครั้ง</div>' +
            '<div style="margin-top:20px;font-size:11px;font-weight:600;color:#94a3b8;word-break:break-word;max-width:300px">' +
            (failure ? String(failure).replace(/</g, '&lt;') : 'no error reported') +
            '<br>' + String(navigator.userAgent).replace(/</g, '&lt;') + '</div>' +
            '<a href="/" style="margin-top:24px;padding:12px 24px;background:#7c5cff;color:#fff;border-radius:16px;font-size:13px;font-weight:800;text-decoration:none">โหลดหน้าใหม่</a>';
          document.body.appendChild(box);
          // An overlay rather than replacing #root, and it steps aside if the
          // app does turn up — a phone on a bad connection is slow, not
          // broken, and must not be told otherwise.
          var poll = setInterval(function () {
            if (!mounted()) return;
            clearInterval(poll);
            if (box.parentNode) box.parentNode.removeChild(box);
          }, 500);
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
