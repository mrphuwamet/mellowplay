name = "mellow-play-backend-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "mellow-play-secret-key-12345"

[[d1_databases]]
binding = "DB"
database_name = "mellow_play_db"
database_id = "your-database-id-here"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mellow-play-assets"

[[kv_namespaces]]
binding = "OTP_KV"
id = "mellow_play_otp_kv"
