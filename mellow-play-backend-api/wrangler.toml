name = "mellow-play-backend-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Production (branch: main)
[vars]
ENVIRONMENT = "production"
JWT_SECRET = "5fcf231b9b050f71452bb4d637d68a820dad6c51c88d4e3bfafc495232094d18d"
GOOGLE_CLIENT_ID = "696563144967-jirued97ecjseko0om8h6d5325h58s2g.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "mellow_play_db"
database_id = "3bdbdbe1-f307-45f9-85ea-8630660e9783"
preview_database_id = "e502e26f-dff8-4006-ad51-c4cd89db3d22"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mellow-play-assets"
preview_bucket_name = "mellow-play-assets-preview"

[[kv_namespaces]]
binding = "OTP_KV"
id = "719ca37082ed4161b640df49cf8fce3d"
preview_id = "e923d5d6ead848c88312b52bf8f79b6d"

# Daily cleanup of Api_Call_Logs/System_Logs older than 30 days (see
# scheduled() in src/index.ts) — 19:00 UTC = 02:00 Bangkok (UTC+7), a
# low-traffic hour.
[triggers]
crons = ["0 19 * * *"]

